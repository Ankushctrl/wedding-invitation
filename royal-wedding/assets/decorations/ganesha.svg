<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <defs>
    <linearGradient id="ganeshaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE89E"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#9A7B1C"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aura Glow Circle -->
  <circle cx="100" cy="110" r="90" fill="url(#sunGlow)"/>

  <!-- Ornate Halo Ring -->
  <circle cx="100" cy="95" r="75" fill="none" stroke="url(#ganeshaGold)" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="100" cy="95" r="79" fill="none" stroke="url(#ganeshaGold)" stroke-width="0.8"/>

  <!-- Crown / Mukut -->
  <path d="M75,55 L85,25 L100,10 L115,25 L125,55 Z" fill="url(#ganeshaGold)" stroke="#805A17" stroke-width="1"/>
  <circle cx="100" cy="28" r="4" fill="#780016"/>
  <circle cx="85" cy="40" r="3" fill="#0E5E7A"/>
  <circle cx="115" cy="40" r="3" fill="#0E5E7A"/>

  <!-- Ganesha Head & Large Ear Left -->
  <path d="M75,55 C40,55 35,90 60,105 C68,110 75,100 78,85" fill="none" stroke="url(#ganeshaGold)" stroke-width="3" stroke-linecap="round"/>
  <!-- Inner Ear Detail Left -->
  <path d="M68,70 C52,72 50,88 62,96" fill="none" stroke="url(#ganeshaGold)" stroke-width="1.5"/>

  <!-- Forehead / Mastak and Tilak -->
  <path d="M75,55 C85,50 115,50 125,55" fill="none" stroke="url(#ganeshaGold)" stroke-width="3"/>
  <!-- Red Sacred Tilak -->
  <path d="M96,48 L100,38 L104,48 Z" fill="#800020"/>
  <line x1="92" y1="52" x2="108" y2="52" stroke="#800020" stroke-width="2"/>
  <line x1="90" y1="56" x2="110" y2="56" stroke="#D4AF37" stroke-width="1.5"/>
  <circle cx="100" cy="62" r="2.5" fill="#800020"/>

  <!-- Trunk (Vakratunda graceful sweep to the left / modak) -->
  <path d="M96,65 
           C96,80 92,100 88,115 
           C84,130 80,145 92,155 
           C102,162 118,155 116,140 
           C114,130 102,132 104,138" 
        fill="none" stroke="url(#ganeshaGold)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Right Tusk (Ekdanta) -->
  <path d="M110,88 L122,93 L110,95 Z" fill="url(#ganeshaGold)"/>

  <!-- Modak on Trunk Tip -->
  <circle cx="106" cy="138" r="4" fill="#FFC837"/>

  <!-- Right Hand Blessing (Abhaya Mudra) -->
  <path d="M125,75 C145,80 155,95 145,115 C140,110 135,105 130,95" fill="none" stroke="url(#ganeshaGold)" stroke-width="3" stroke-linecap="round"/>
  <!-- Om symbol in blessing palm -->
  <circle cx="140" cy="98" r="3" fill="#800020"/>

  <!-- Lotus Seat Base -->
  <path d="M50,175 C70,165 100,165 100,178 C100,165 130,165 150,175 C160,190 130,195 100,195 C70,195 40,190 50,175 Z" fill="url(#ganeshaGold)" opacity="0.85"/>
  <path d="M70,178 C85,170 100,170 100,185 C100,170 115,170 130,178" fill="none" stroke="#540B1E" stroke-width="1.5"/>
</svg>