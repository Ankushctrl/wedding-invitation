<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gBangle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE89E"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#805A17"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#4A0B1A" stroke="url(#gBangle)" stroke-width="2"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#gBangle)" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- Concentric Wedding Bangles (Chooda & Kada) -->
  <!-- Outer Kada -->
  <ellipse cx="50" cy="46" rx="28" ry="18" fill="none" stroke="url(#gBangle)" stroke-width="3.5"/>
  <ellipse cx="50" cy="46" rx="28" ry="18" fill="none" stroke="#E63946" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Mid Red Chooda Bangle -->
  <ellipse cx="50" cy="52" rx="25" ry="16" fill="none" stroke="#E63946" stroke-width="3"/>
  <ellipse cx="50" cy="52" rx="25" ry="16" fill="none" stroke="url(#gBangle)" stroke-width="1" stroke-dasharray="2,4"/>

  <!-- Lower Golden Kada with Hanging Kalire -->
  <ellipse cx="50" cy="58" rx="28" ry="18" fill="none" stroke="url(#gBangle)" stroke-width="3.5"/>

  <!-- Hanging Golden Kalire Ornaments -->
  <line x1="36" y1="68" x2="36" y2="78" stroke="url(#gBangle)" stroke-width="1.5"/>
  <circle cx="36" cy="80" r="3" fill="url(#gBangle)"/>

  <line x1="50" y1="74" x2="50" y2="84" stroke="url(#gBangle)" stroke-width="1.5"/>
  <circle cx="50" cy="86" r="3.5" fill="url(#gBangle)"/>

  <line x1="64" y1="68" x2="64" y2="78" stroke="url(#gBangle)" stroke-width="1.5"/>
  <circle cx="64" cy="80" r="3" fill="url(#gBangle)"/>
</svg>