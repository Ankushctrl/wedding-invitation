<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gHaldi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE89E"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B1C"/>
    </linearGradient>
    <radialGradient id="turmericPaste" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFDD00"/>
      <stop offset="70%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#FB8500"/>
    </radialGradient>
  </defs>

  <circle cx="50" cy="50" r="46" fill="#422505" stroke="url(#gHaldi)" stroke-width="2"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#gHaldi)" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- Royal Brass Urli Bowl -->
  <!-- Bowl Base and Stand -->
  <path d="M42,75 L58,75 L55,79 L45,79 Z" fill="url(#gHaldi)"/>
  
  <!-- Bowl Rim and Body -->
  <ellipse cx="50" cy="55" rx="30" ry="12" fill="url(#turmericPaste)" stroke="url(#gHaldi)" stroke-width="2"/>
  <path d="M20,55 C20,70 32,75 50,75 C68,75 80,70 80,55" fill="none" stroke="url(#gHaldi)" stroke-width="2.5"/>

  <!-- Ornate Carved Bowl Handles -->
  <path d="M19,53 C14,50 12,58 19,60" fill="none" stroke="url(#gHaldi)" stroke-width="2"/>
  <path d="M81,53 C86,50 88,58 81,60" fill="none" stroke="url(#gHaldi)" stroke-width="2"/>

  <!-- Marigold Petals Floating in Haldi -->
  <!-- Flower 1 (Center) -->
  <circle cx="50" cy="53" r="5" fill="#FB8500"/>
  <circle cx="50" cy="53" r="2.5" fill="#FFB703"/>
  <!-- Flower 2 (Left) -->
  <circle cx="36" cy="55" r="4" fill="#FFB703"/>
  <!-- Flower 3 (Right) -->
  <circle cx="64" cy="55" r="4" fill="#FFB703"/>

  <!-- Floating Marigold Garland Above -->
  <path d="M30,35 Q50,42 70,35" fill="none" stroke="#FB8500" stroke-width="2"/>
  <circle cx="30" cy="35" r="3.5" fill="#FFB703"/>
  <circle cx="40" cy="38" r="3.5" fill="#FB8500"/>
  <circle cx="50" cy="39" r="4" fill="#FFB703"/>
  <circle cx="60" cy="38" r="3.5" fill="#FB8500"/>
  <circle cx="70" cy="35" r="3.5" fill="#FFB703"/>

  <!-- Radiating Blessing Sparkles -->
  <path d="M50,20 L50,26 M40,24 L44,28 M60,24 L56,28" stroke="url(#gHaldi)" stroke-width="1.5" stroke-linecap="round"/>
</svg>