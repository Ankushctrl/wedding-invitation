<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gSangeet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE89E"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B1C"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="46" fill="#0C2D3A" stroke="url(#gSangeet)" stroke-width="2"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#gSangeet)" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- Sitar Neck & Tumba -->
  <!-- Sitar Gourd / Base -->
  <circle cx="36" cy="64" r="16" fill="#800020" stroke="url(#gSangeet)" stroke-width="2"/>
  <circle cx="36" cy="64" r="11" fill="none" stroke="url(#gSangeet)" stroke-width="1"/>
  <circle cx="36" cy="64" r="5" fill="url(#gSangeet)"/>

  <!-- Sitar Long Fretboard / Dandi -->
  <line x1="46" y1="54" x2="72" y2="28" stroke="url(#gSangeet)" stroke-width="4" stroke-linecap="round"/>
  <!-- Frets -->
  <line x1="49" y1="51" x2="52" y2="54" stroke="#FFF" stroke-width="1.2"/>
  <line x1="55" y1="45" x2="58" y2="48" stroke="#FFF" stroke-width="1.2"/>
  <line x1="61" y1="39" x2="64" y2="42" stroke="#FFF" stroke-width="1.2"/>
  <line x1="67" y1="33" x2="70" y2="36" stroke="#FFF" stroke-width="1.2"/>

  <!-- Pegs / Khuntis -->
  <circle cx="70" cy="24" r="2.5" fill="url(#gSangeet)"/>
  <circle cx="74" cy="28" r="2.5" fill="url(#gSangeet)"/>
  <line x1="72" y1="28" x2="78" y2="22" stroke="url(#gSangeet)" stroke-width="2"/>

  <!-- Tabla (Bayan & Dayan) in background -->
  <!-- Dayan (Treble Drum) -->
  <ellipse cx="65" cy="66" rx="11" ry="8" fill="#540B1E" stroke="url(#gSangeet)" stroke-width="1.5"/>
  <ellipse cx="65" cy="66" rx="4.5" ry="3.5" fill="#1A1A1A"/>
  <path d="M54,66 L57,78 L73,78 L76,66" fill="#805A17" stroke="url(#gSangeet)" stroke-width="1"/>

  <!-- Musical Rhythm Notes & Stars -->
  <path d="M26,30 L26,22 L35,26 L35,34" fill="none" stroke="url(#gSangeet)" stroke-width="1.5"/>
  <circle cx="24" cy="30" r="2.5" fill="url(#gSangeet)"/>
  <circle cx="33" cy="34" r="2.5" fill="url(#gSangeet)"/>

  <!-- Sparkles -->
  <path d="M20,46 L22,46 M21,44 L21,48" stroke="url(#gSangeet)" stroke-width="1.5"/>
  <path d="M78,48 L80,48 M79,46 L79,50" stroke="url(#gSangeet)" stroke-width="1.5"/>
</svg>