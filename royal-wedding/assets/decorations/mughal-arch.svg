<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="75%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#805A17"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#FDF6D8"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4D64"/>
      <stop offset="50%" stop-color="#146B8A"/>
      <stop offset="100%" stop-color="#093140"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Architectural Border -->
  <rect x="20" y="20" width="760" height="560" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <rect x="28" y="28" width="744" height="544" rx="6" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Ornate Corner Filigrees -->
  <!-- Top Left -->
  <g transform="translate(30, 30)">
    <path d="M0,0 L60,0 C60,30 30,60 0,60 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="4" fill="url(#goldGrad)"/>
    <path d="M0,20 Q20,20 20,0" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
    <path d="M0,40 Q40,40 40,0" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  </g>
  <!-- Top Right -->
  <g transform="translate(770, 30) scale(-1, 1)">
    <path d="M0,0 L60,0 C60,30 30,60 0,60 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="4" fill="url(#goldGrad)"/>
    <path d="M0,20 Q20,20 20,0" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
    <path d="M0,40 Q40,40 40,0" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  </g>
  <!-- Bottom Left -->
  <g transform="translate(30, 570) scale(1, -1)">
    <path d="M0,0 L60,0 C60,30 30,60 0,60 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="4" fill="url(#goldGrad)"/>
    <path d="M0,20 Q20,20 20,0" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
    <path d="M0,40 Q40,40 40,0" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  </g>
  <!-- Bottom Right -->
  <g transform="translate(770, 570) scale(-1, -1)">
    <path d="M0,0 L60,0 C60,30 30,60 0,60 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="4" fill="url(#goldGrad)"/>
    <path d="M0,20 Q20,20 20,0" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
    <path d="M0,40 Q40,40 40,0" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  </g>

  <!-- Left Palace Pillar -->
  <g transform="translate(70, 140)">
    <rect x="0" y="0" width="36" height="420" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <line x1="9" y1="0" x2="9" y2="420" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="8,4"/>
    <line x1="18" y1="0" x2="18" y2="420" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <line x1="27" y1="0" x2="27" y2="420" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="8,4"/>
    <!-- Capital Base -->
    <path d="M-8,420 L44,420 L36,440 L0,440 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <!-- Capital Top -->
    <path d="M-10,0 L46,0 L36,-25 L0,-25 Z" fill="url(#goldGrad)" opacity="0.8"/>
  </g>

  <!-- Right Palace Pillar -->
  <g transform="translate(694, 140)">
    <rect x="0" y="0" width="36" height="420" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <line x1="9" y1="0" x2="9" y2="420" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="8,4"/>
    <line x1="18" y1="0" x2="18" y2="420" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <line x1="27" y1="0" x2="27" y2="420" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="8,4"/>
    <!-- Capital Base -->
    <path d="M-8,420 L44,420 L36,440 L0,440 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <!-- Capital Top -->
    <path d="M-10,0 L46,0 L36,-25 L0,-25 Z" fill="url(#goldGrad)" opacity="0.8"/>
  </g>

  <!-- The Grand Multifoil Mughal Arch (Centred) -->
  <!-- Main Arch Curves -->
  <path d="M 106,140 
           C 106,140 130,105 170,105 
           C 195,105 210,80 240,75 
           C 275,70 295,45 330,42 
           C 365,39 385,20 400,10 
           C 415,20 435,39 470,42 
           C 505,45 525,70 560,75 
           C 590,80 605,105 630,105 
           C 670,105 694,140 694,140" 
        fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Inner Scalloped Fringe Arch -->
  <path d="M 118,150 
           C 118,150 140,118 178,118 
           C 202,118 218,92 245,88 
           C 278,82 298,58 332,55 
           C 364,52 384,32 400,24 
           C 416,32 436,52 468,55 
           C 502,58 522,82 555,88 
           C 582,92 598,118 622,118 
           C 660,118 682,150 682,150" 
        fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Decorative Crest Top Finial (Kalash / Lotus Crown) -->
  <g transform="translate(400, 10)">
    <circle cx="0" cy="-6" r="5" fill="url(#goldGrad)"/>
    <path d="M0,-24 C6,-16 10,-10 0, -6 C-10,-10 -6,-16 0,-24 Z" fill="url(#goldGrad)"/>
    <path d="M-12,-4 C-6,-12 6,-12 12,-4 C6,-2 -6,-2 -12,-4 Z" fill="url(#goldGrad)"/>
    <circle cx="-16" cy="12" r="3" fill="url(#goldGrad)"/>
    <circle cx="16" cy="12" r="3" fill="url(#goldGrad)"/>
  </g>

  <!-- Hanging Pearl / Jhumka Beads Along the Arch -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <circle cx="170" cy="112" r="3"/>
    <line x1="170" y1="112" x2="170" y2="124" stroke="url(#goldGrad)" stroke-width="1"/>
    <circle cx="170" cy="124" r="2"/>

    <circle cx="240" cy="82" r="3"/>
    <line x1="240" y1="82" x2="240" y2="94" stroke="url(#goldGrad)" stroke-width="1"/>
    <circle cx="240" cy="94" r="2"/>

    <circle cx="330" cy="49" r="3"/>
    <line x1="330" y1="49" x2="330" y2="61" stroke="url(#goldGrad)" stroke-width="1"/>
    <circle cx="330" cy="61" r="2"/>

    <circle cx="470" cy="49" r="3"/>
    <line x1="470" y1="49" x2="470" y2="61" stroke="url(#goldGrad)" stroke-width="1"/>
    <circle cx="470" cy="61" r="2"/>

    <circle cx="560" cy="82" r="3"/>
    <line x1="560" y1="82" x2="560" y2="94" stroke="url(#goldGrad)" stroke-width="1"/>
    <circle cx="560" cy="94" r="2"/>

    <circle cx="630" cy="112" r="3"/>
    <line x1="630" y1="112" x2="630" y2="124" stroke="url(#goldGrad)" stroke-width="1"/>
    <circle cx="630" cy="124" r="2"/>
  </g>
</svg>