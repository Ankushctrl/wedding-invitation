      <g transform="rotate(90)"><path d="M0,-50 C-10,-35 -8,-15 0,0 C8,-15 10,-35 0,-50 Z" fill="url(#mGold)" stroke="#800020" stroke-width="1"/></g>
      <g transform="rotate(135)"><path d="M0,-50 C-10,-35 -8,-15 0,0 C8,-15 10,-35 0,-50 Z" fill="url(#mGold)" stroke="#800020" stroke-width="1"/></g>
      <g transform="rotate(180)"><path d="M0,-50 C-10,-35 -8,-15 0,0 C8,-15 10,-35 0,-50 Z" fill="url(#mGold)" stroke="#800020" stroke-width="1"/></g>
      <g transform="rotate(225)"><path d="M0,-50 C-10,-35 -8,-15 0,0 C8,-15 10,-35 0,-50 Z" fill="url(#mGold)" stroke="#800020" stroke-width="1"/></g>
